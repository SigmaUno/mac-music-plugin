name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift run MMPTests

      - name: Bundle app
        run: sh scripts/bundle.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacMusicPlugin.app
          path: dist/MacMusicPlugin.app
